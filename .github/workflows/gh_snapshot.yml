name: dashboard-snapshot

on:
  schedule:
    # 交易时段每30分钟快照（公开仓库Actions免费）
    # UTC 01:00-07:30 = 北京09:00-15:30；UTC 13:00-15:30 = 北京21:00-23:30
    - cron: '*/30 1-7 * * 1-5'
    - cron: '*/30 13-15 * * 1-5'
  workflow_dispatch:            # 允许手动触发

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 生成数据快照
        run: python deploy/gh_dashboard.py

      - name: 提交快照到仓库
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json iv_meta.json iv_history.json 2>/dev/null || true
          git commit -m "数据快照 $(date -u +%FT%TZ)" || echo "无变化"
          git push
