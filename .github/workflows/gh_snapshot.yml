name: dashboard-snapshot

on:
  schedule:
    # UTC时间，北京时间=UTC+8，仅周一至周五
    - cron: '30 1 * * 1-5'     # 09:30 盘前
    - cron: '30 3 * * 1-5'     # 11:30 早盘收
    - cron: '30 5 * * 1-5'     # 13:30 午盘
    - cron: '0 7 * * 1-5'      # 15:00 日盘收
    - cron: '30 14 * * 1-5'    # 22:30 夜盘
  workflow_dispatch:            # 允许手动触发

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 生成数据快照
        run: python deploy/gh_dashboard.py

      - name: 提交快照到仓库
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json iv_meta.json iv_history.json 2>/dev/null || true
          git commit -m "数据快照 $(date -u +%FT%TZ)" || echo "无变化"
          git push
